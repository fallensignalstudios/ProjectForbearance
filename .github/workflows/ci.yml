name: ci

# On each pull request: compile, validate the catalog, run the unit and
# integration tests, replay the golden fixtures, and reject an unacknowledged
# balance or hash change (technical design, Section 19.4).
# Runs on every push and every pull request. The branch filter is deliberately
# absent: this repository has no trunk yet, so pinning the push trigger to `main`
# would mean no run at all.
on:
  pull_request:
  push:

jobs:
  headless:
    name: headless core (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          if [ "${{ matrix.compiler }}" = "clang" ]; then sudo apt-get install -y clang; fi

      - name: Configure
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            export CC=clang CXX=clang++
          fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DEXPANSION_WERROR=ON

      - name: Build
        run: cmake --build build

      - name: Validate the catalog and the neutral preflight
        run: ./build/expansion validate --content=content

      - name: Unit and integration tests
        run: ./build/expansion_tests

      # The same suite against the single translation unit the Unreal module
      # compiles. It is the only evidence available here that the engine's
      # compilation arrangement produces the same simulation, and it catches the
      # two hazards of sharing one unit -- a name collision between two file-static
      # helpers, and a macro leaking from one source to the next -- without an
      # engine (docs/decisions/0010-unreal-host.md).
      - name: Unit and integration tests, as one translation unit
        run: ./build/expansion_tests_amalgamated

      - name: Replay the golden fixtures
        run: tools/validate_content/validate_content.sh content build/expansion

      - name: Same-build determinism
        run: |
          for journal in tests/replays/*.journal.json; do
            ./build/expansion verify --content=content --journal="$journal"
          done

  engine-compilation-path:
    name: engine compilation path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      # Three lists have to agree about which sources exist: the tree,
      # CMakeLists.txt, and the Unreal module's translation unit. A source added
      # to two of the three builds here and fails in an engine nobody can run
      # here, or the reverse.
      - name: The three source lists agree
        run: python3 tools/check_amalgamation.py

      - name: Configure and build the single translation unit
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DEXPANSION_WERROR=ON
          cmake --build build --target expansion_amalgamated expansion_tests_amalgamated expansion_cli

      # Compiling is not enough: it has to be the same simulation. Every golden
      # replay hash is compared inside this suite.
      - name: The single translation unit is the same simulation
        run: ./build/expansion_tests_amalgamated

      - name: Every recorded run replays identically
        run: |
          for journal in tests/replays/*.journal.json; do
            ./build/expansion replay --content=content --journal="$journal"
          done

  cross-compiler-determinism:
    name: cross-compiler determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang

      - name: Build with both compilers
        run: |
          cmake -S . -B build-gcc -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build-gcc --target expansion_cli
          CC=clang CXX=clang++ cmake -S . -B build-clang -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build-clang --target expansion_cli

      - name: Compare canonical hashes for every recorded run
        run: |
          status=0
          for journal in tests/replays/*.journal.json; do
            a=$(./build-gcc/expansion replay --content=content --journal="$journal" | awk '/final hash/ {print $3}')
            b=$(./build-clang/expansion replay --content=content --journal="$journal" | awk '/final hash/ {print $3}')
            if [ "$a" = "$b" ]; then
              echo "match  $(basename "$journal")  $a"
            else
              echo "DIFFER $(basename "$journal"): gcc=$a clang=$b"
              status=1
            fi
          done
          exit $status

  # A Linux headless pass does not prove Windows packaging or an Unreal build.
  #
  # The presentation host is now approved as Unreal Engine 5 (decision 0010), and
  # the `engine-compilation-path` job above verifies everything about that path
  # that can be verified without an engine: that the simulation compiles as the
  # single translation unit the module uses, that it is the same simulation hash
  # for hash, and that the source lists agree.
  #
  # What is still missing is a job that compiles `hosts/unreal/` itself, which
  # needs an engine installation on the runner. Until that exists, nothing under
  # `hosts/unreal/` has been compiled by anything, and every file there says so.
  # A Windows packaging job is likewise absent. Both absences are deliberate.
